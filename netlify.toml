# Netlify configuration for a plain static site — no build step needed,
# the site is served as-is.

[build]
  publish = "."

[[headers]]
  # Keep the directory data short-cached so a fresh scraper run (which
  # triggers a new deploy) shows up for visitors within minutes, not
  # whatever the browser's default cache would otherwise pick.
  for = "/data/companies.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
